" stroke="#D8E3DA" stroke-width="2"/><text x="96" y="418" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="700" fill="#0F4C3A">工艺</text><text x="300" y="418" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="21" fill="#33424a">低温萃取 + 零下 40℃ 真空冻干</text><line x1="96" y1="436" x2="704" y2="436" stroke="#D8E3DA" stroke-width="2"/><text x="96" y="474" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="700" fill="#0F4C3A">冲泡比例</text><text x="300" y="474" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="21" fill="#33424a">1 支兑 200-300ml 水，冷热皆可</text><line x1="96" y1="492" x2="704" y2="492" stroke="#D8E3DA" stroke-width="2"/><text x="96" y="530" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="700" fill="#0F4C3A">保质期</text><text x="300" y="530" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="21" fill="#33424a">18 个月，开封后建议 30 天内喝完</text><line x1="96" y1="548" x2="704" y2="548" stroke="#D8E3DA" stroke-width="2"/><text x="96" y="586" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="700" fill="#0F4C3A">储存条件</text><text x="300" y="586" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="21" fill="#33424a">阴凉干燥处避光保存，避免高温</text><line x1="96" y1="604" x2="704" y2="604" stroke="#D8E3DA" stroke-width="2"/><text x="96" y="642" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="700" fill="#0F4C3A">执行标准</text><text x="300" y="642" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="21" fill="#33424a">GB/T 21733（茶饮料固体原料参考）</text><line x1="96" y1="660" x2="704" y2="660" stroke="#D8E3DA" stroke-width="2"/></svg>